name: CI Mobile Verification (Skip & Swift)

on:
  push:
    branches: [ main ]
    paths:
      - 'Sources/**'
      - 'Package.swift'
      - '.github/workflows/ci-mobile.yml'
  pull_request:
    branches: [ main ]

jobs:
  verify-swift:
    name: Verify Swift iOS Package
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Resolve Package Dependencies
        run: swift package resolve

      - name: Build & Typecheck Package
        run: swift build
