name: Mobile E2E (Maestro)

on:
  push:
    branches: [ main ]
    paths:
      - 'Sources/**'
      - 'Package.swift'
      - '.maestro/**'
      - '.github/workflows/mobile-e2e.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Sources/**'
      - 'Package.swift'
      - '.maestro/**'
      - '.github/workflows/mobile-e2e.yml'
  workflow_dispatch:

concurrency:
  group: mobile-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maestro-ios:
    name: Maestro UI Tests (iOS Simulator)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Repository
        id: checkout
        uses: actions/checkout@v4

      - name: Set up Java 17 (Maestro runtime)
        id: java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Maestro
        id: maestro
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Mobile E2E (Maestro)" maestro \
            "checkout:Checkout Repository|java:Set up Java 17 (Maestro runtime)|maestro:Install Maestro|device:Pick Available iPhone Simulator|build:Build App for Simulator|boot:Boot Simulator and Install App|flows:Run Maestro Flows|upload:Upload Test Reports" \
            "checkout=${{ steps.checkout.outcome }};java=${{ steps.java.outcome }}"
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Pick Available iPhone Simulator
        id: device
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Mobile E2E (Maestro)" device \
            "checkout:Checkout Repository|java:Set up Java 17 (Maestro runtime)|maestro:Install Maestro|device:Pick Available iPhone Simulator|build:Build App for Simulator|boot:Boot Simulator and Install App|flows:Run Maestro Flows|upload:Upload Test Reports" \
            "checkout=${{ steps.checkout.outcome }};java=${{ steps.java.outcome }};maestro=${{ steps.maestro.outcome }}"
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c "
            import json, sys
            data = json.load(sys.stdin)
            udid = None
            for runtime in sorted(data.get('devices', {}).keys(), reverse=True):
                for device in data['devices'][runtime]:
                    if device.get('name', '').startswith('iPhone') and device.get('isAvailable'):
                        udid = device['udid']
                        break
                if udid:
                    break
            if not udid:
                sys.exit('No available iPhone simulator found')
            print(udid)
          ")
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          echo "Picked simulator: $DEVICE_ID"

      - name: Build App for Simulator
        id: build
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Mobile E2E (Maestro)" build \
            "checkout:Checkout Repository|java:Set up Java 17 (Maestro runtime)|maestro:Install Maestro|device:Pick Available iPhone Simulator|build:Build App for Simulator|boot:Boot Simulator and Install App|flows:Run Maestro Flows|upload:Upload Test Reports" \
            "checkout=${{ steps.checkout.outcome }};java=${{ steps.java.outcome }};maestro=${{ steps.maestro.outcome }};device=${{ steps.device.outcome }}"
          xcodebuild build \
            -workspace Project.xcworkspace \
            -scheme "Audiobookphile App" \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath .build/e2e-dd \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""
        continue-on-error: true

      - name: Boot Simulator and Install App
        id: boot
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Mobile E2E (Maestro)" boot \
            "checkout:Checkout Repository|java:Set up Java 17 (Maestro runtime)|maestro:Install Maestro|device:Pick Available iPhone Simulator|build:Build App for Simulator|boot:Boot Simulator and Install App|flows:Run Maestro Flows|upload:Upload Test Reports" \
            "checkout=${{ steps.checkout.outcome }};java=${{ steps.java.outcome }};maestro=${{ steps.maestro.outcome }};device=${{ steps.device.outcome }};build=${{ steps.build.outcome }}"
          ls -d .build/e2e-dd/Build/Products/Debug-iphonesimulator/Audiobookphile.app
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" .build/e2e-dd/Build/Products/Debug-iphonesimulator/Audiobookphile.app

      - name: Run Maestro Flows
        id: flows
        env:
          MAESTRO_CLI_NO_ANALYTICS: "true"
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Mobile E2E (Maestro)" flows \
            "checkout:Checkout Repository|java:Set up Java 17 (Maestro runtime)|maestro:Install Maestro|device:Pick Available iPhone Simulator|build:Build App for Simulator|boot:Boot Simulator and Install App|flows:Run Maestro Flows|upload:Upload Test Reports" \
            "checkout=${{ steps.checkout.outcome }};java=${{ steps.java.outcome }};maestro=${{ steps.maestro.outcome }};device=${{ steps.device.outcome }};build=${{ steps.build.outcome }};boot=${{ steps.boot.outcome }}"
          set +e
          maestro test .maestro \
            --format junit \
            --output .maestro-results/
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo "Maestro failures:"
            find .maestro-results -name '*.xml' -exec cat {} +
            exit $STATUS
          fi

      - name: Upload Test Reports
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-results
          path: .maestro-results/
          if-no-files-found: ignore
