name: Mobile E2E (Maestro)

on:
  push:
    branches: [ main ]
    paths:
      - 'Sources/**'
      - 'Package.swift'
      - '.maestro/**'
      - '.github/workflows/mobile-e2e.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Sources/**'
      - 'Package.swift'
      - '.maestro/**'
      - '.github/workflows/mobile-e2e.yml'
  workflow_dispatch:

concurrency:
  group: mobile-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maestro-ios:
    name: Maestro UI Tests (iOS Simulator)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Repository
        id: checkout
        uses: actions/checkout@v7

      - name: Build App for Simulator
        id: build
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Mobile E2E (Maestro)" build \
            "checkout:Checkout Repository|build:Build App for Simulator|guard:Check Secrets|flows:Run Maestro Cloud" \
            "checkout=${{ steps.checkout.outcome }}"
          xcodebuild build \
            -workspace Project.xcworkspace \
            -scheme "Audiobookphile App" \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=iPhone 15" \
            -derivedDataPath .build/e2e-dd \
            -skipPackagePluginValidation
          cd .build/e2e-dd/Build/Products/Debug-iphonesimulator
          zip -q -r Audiobookphile.zip Audiobookphile.app

      - name: Check Secrets
        id: guard
        env:
          TEST_EMAIL: ${{ secrets.MAESTRO_TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.MAESTRO_TEST_PASSWORD }}
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Mobile E2E (Maestro)" guard \
            "checkout:Checkout Repository|build:Build App for Simulator|guard:Check Secrets|flows:Run Maestro Cloud" \
            "checkout=${{ steps.checkout.outcome }};build=${{ steps.build.outcome }}"
          if [ -z "${TEST_EMAIL}" ] || [ -z "${TEST_PASSWORD}" ]; then
            echo "❌ MAESTRO_TEST_EMAIL / MAESTRO_TEST_PASSWORD secrets are not configured"
            echo "   Set them in repo settings → Secrets and variables → Actions:"
            echo "   - MAESTRO_TEST_EMAIL:    test account email (no 2FA)"
            echo "   - MAESTRO_TEST_PASSWORD: its password"
            exit 1
          fi

      - name: Run Maestro Cloud
        id: flows
        uses: mobile-dev-inc/action-maestro-cloud@v3.0.1
        with:
          api-key: ${{ secrets.MAESTRO_CLOUD_API_KEY }}
          app-file: .build/e2e-dd/Build/Products/Debug-iphonesimulator/Audiobookphile.zip
          workspace: .maestro
          include-tags: smoke,e2e
          env: |
            SERVER_URL=${{ secrets.MAESTRO_SERVER_URL || 'https://audiobookphile.vercel.app' }}
            TEST_EMAIL=${{ secrets.MAESTRO_TEST_EMAIL }}
            TEST_PASSWORD=${{ secrets.MAESTRO_TEST_PASSWORD }}
