pre-commit:
  parallel: true
  commands:
    swiftlint-and-build:
      glob: "*.{swift,json,yml}"
      run: ./scripts/pre-commit.sh {staged_files}

commit-msg:
  commands:
    conventional-commit:
      run: ./scripts/commit-msg.sh {1}

pre-push:
  parallel: false
  commands:
    full-test-suite:
      run: swift test

post-merge:
  commands:
    package-resolve:
      glob: "Package.resolved"
      run: swift package resolve

post-checkout:
  commands:
    package-resolve:
      glob: "Package.resolved"
      run: swift package resolve
