pre-commit:
  parallel: true
  commands:
    swiftlint-and-build:
      glob: "*.swift"
      run: ./scripts/pre-commit.sh {staged_files}

commit-msg:
  commands:
    conventional-commit:
      run: ./scripts/commit-msg.sh {1}

pre-push:
  parallel: false
  commands:
    full-test-suite:
      run: swift test
