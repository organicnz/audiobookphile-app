appId: club.foodshare.audiobookphile
name: App Launches and Renders All Five Tabs
---
# Smoke test: the app must boot, render the tab bar with all five tabs, and
# recover from the "no server" connect sheet (fresh install state).
- launchApp:
    clearState: true
    stopApp: true
- extendedWaitUntil:
    visible: "Audiobookphile"
    timeout: 20000
# Fresh installs present the Connect sheet automatically. Dismiss it when
# present so the tab bar underneath is reachable.
- runFlow:
    when:
      visible:
        id: "abp_connect_dismiss"
    commands:
      - tapOn:
          id: "abp_connect_dismiss"
- extendedWaitUntil:
    visible: "Home"
    timeout: 10000
- assertVisible: "Library"
- assertVisible: "Collections"
- assertVisible: "Downloads"
- assertVisible: "Search"
- takeScreenshot: smoke-launch
