appId: club.foodshare.audiobookphile
name: Magic-link email can be requested
tags:
  - auth
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Sign In"
    timeout: 20000
- tapOn:
    id: "abp_server_url_field"
- inputText: ${SERVER_URL}
- tapOn:
    id: "abp_email_field"
- inputText: ${TEST_EMAIL}
- hideKeyboard
# abp_magic_link_send accessibilityIdentifier on the button in ConnectView.
- scrollUntilVisible:
    element:
      id: "abp_magic_link_send"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "abp_magic_link_send"
- extendedWaitUntil:
    visible: "Magic link sent! Check your email"
    timeout: 30000
