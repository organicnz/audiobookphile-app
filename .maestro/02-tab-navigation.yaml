appId: club.foodshare.audiobookphile
name: Tab Navigation Works
---
- launchApp:
    clearState: true
    stopApp: true
- extendedWaitUntil:
    visible: "Audiobookphile"
    timeout: 20000
- runFlow:
    when:
      visible:
        id: "abp_connect_dismiss"
    commands:
      - tapOn:
          id: "abp_connect_dismiss"
- extendedWaitUntil:
    visible: "Home"
    timeout: 10000
# Search tab exposes the static search field (no backend required).
- tapOn: "Search"
- extendedWaitUntil:
    visible: "Title, Author, or Series"
    timeout: 10000
# Home tab via its toolbar capsule label (defaults to "All Books").
- tapOn: "Home"
- extendedWaitUntil:
    visible: "All Books"
    timeout: 10000
- takeScreenshot: tab-navigation
