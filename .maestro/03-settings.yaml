appId: club.foodshare.audiobookphile
name: Settings Opens and Shows App Sections
---
- launchApp:
    clearState: true
    stopApp: true
- extendedWaitUntil:
    visible: "Audiobookphile"
    timeout: 20000
- runFlow:
    when:
      visible:
        id: "abp_connect_dismiss"
    commands:
      - tapOn:
          id: "abp_connect_dismiss"
- extendedWaitUntil:
    visible: "Home"
    timeout: 10000
- tapOn:
    id: "abp_settings_button"
- extendedWaitUntil:
    visible: "Settings"
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "Theme"
    direction: DOWN
    timeout: 20000
- assertVisible: "Theme"
- scrollUntilVisible:
    element:
      text: "Haptic Feedback"
    direction: DOWN
    timeout: 20000
- assertVisible: "Haptic Feedback"
- scrollUntilVisible:
    element:
      text: "Version"
    direction: DOWN
    timeout: 20000
- assertVisible: "Version"
- takeScreenshot: settings