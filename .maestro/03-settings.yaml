appId: club.foodshare.audiobookphile
name: Settings Opens and Shows App Sections
---
- launchApp:
    clearState: true
    stopApp: true
- extendedWaitUntil:
    visible: "Audiobookphile"
    timeout: 20000
- runFlow:
    when:
      visible:
        id: "abp_connect_dismiss"
    commands:
      - tapOn:
          id: "abp_connect_dismiss"
- extendedWaitUntil:
    visible: "Home"
    timeout: 10000
- tapOn:
    id: "abp_settings_button"
- extendedWaitUntil:
    visible: "Settings"
    timeout: 10000
# App-section rows sit below the fold; swipe explicitly (repeated swipes
# are more reliable than scrollUntilVisible across simulator sizes/OSes).
- swipe:
    start: 50%, 80%
    end: 50%, 30%
    duration: 600
- swipe:
    start: 50%, 80%
    end: 50%, 30%
    duration: 600
- swipe:
    start: 50%, 80%
    end: 50%, 30%
    duration: 600
- extendedWaitUntil:
    visible: "Theme"
    timeout: 10000
- assertVisible: "Haptic Feedback"
- assertVisible: "Version"
- takeScreenshot: settings